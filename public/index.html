<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Monkeys - Amazon Tech Deals Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .deal-card { background: #1e1e1e; border: 1px solid #333; margin: 15px 0; padding: 15px; border-radius: 8px; text-align: left; }
        .deal-title { font-size: 1.2em; font-weight: bold; color: #f39c12; }
        .price { color: #2ecc71; font-weight: bold; }
        .original-price { text-decoration: line-through; color: #888; margin-right: 10px; }
        .discount { background: #e74c3c; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; }
        .ad-container { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Three Monkeys - Tech Deals Scanner</h1>
        <p>Live Automated Tech Deals & Curated Offers</p>

        <!-- A-Ads Banner Unit #2454491 -->
        <div class="ad-container">
            <iframe data-aa='2454491' src='//ad.a-ads.com/2454491?size=728x90' style='width:728px; height:90px; border:0px; padding:0; overflow:hidden; background-color: transparent;'></iframe>
        </div>

        <div id="deals-list">Loading latest tech deals...</div>
    </div>

    <script>
        async function fetchDeals() {
            try {
                const response = await fetch('/api/deals');
                const deals = await response.json();
                const container = document.getElementById('deals-list');
                container.innerHTML = '';

                deals.forEach(deal => {
                    const card = document.createElement('div');
                    card.className = 'deal-card';
                    card.innerHTML = `
                        <div class="deal-title">${deal.title} <span class="discount">${deal.discount}</span></div>
                        <p>Category: ${deal.category}</p>
                        <p>
                            Price: <span class="original-price">${deal.originalPrice}</span>
                            <span class="price">${deal.dealPrice}</span>
                        </p>
                        <a href="https://www.amazon.co.uk/?tag=${deal.tag}" target="_blank" style="color: #3498db;">View Deal on Amazon</a>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Error fetching deals:", err);
            }
        }
        fetchDeals();
    </script>
</body>
</html>
