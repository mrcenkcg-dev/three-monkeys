<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Live Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #f39c12;
        }
        .ad-container {
            width: 100%;
            max-width: 728px;
            height: 90px;
            background-color: #1e1e1e;
            border: 1px dashed #444;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            background-color: #1e1e1e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #2a2a2a;
            color: #f39c12;
        }
        tr:hover {
            background-color: #252525;
        }
        .up { color: #2ecc71; }
        .down { color: #e74c3c; }
    </style>
</head>
<body>

    <h1>Live Crypto Tracker</h1>

    <!-- AD UNIT PLACEHOLDER -->
    <div class="ad-container">
        <!-- BEGIN AADS AD UNIT 2454491 -->
        <div id="frame" style="width: 728px;margin: auto;z-index: 99998;height: auto">
          <iframe data-aa='2454491' src='//ad.a-ads.com/2454491/?size=728x90' style='border:0; padding:0; width:728px; height:90px; overflow:hidden;display: block;margin: auto'></iframe>
        </div>
        <!-- END AADS AD UNIT 2454491 -->
    </div>

    <table>
        <thead>
            <tr>
                <th>Asset</th>
                <th>Price (USD)</th>
                <th>24h Change</th>
            </tr>
        </thead>
        <tbody id="crypto-table-body">
            <tr>
                <td colspan="3">Loading market data...</td>
            </tr>
        </tbody>
    </table>

    <script>
        async function fetchPrices() {
            try {
                const response = await fetch('/api/prices');
                const data = await response.json();
                const tbody = document.getElementById('crypto-table-body');
                tbody.innerHTML = '';

                data.forEach(coin => {
                    const row = document.createElement('tr');
                    const changeClass = coin.change_24h >= 0 ? 'up' : 'down';
                    
                    row.innerHTML = `
                        <td><strong>${coin.symbol.toUpperCase()}</strong></td>
                        <td>$${parseFloat(coin.price).toLocaleString()}</td>
                        <td class="${changeClass}">${coin.change_24h}%</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error('Failed to fetch prices:', err);
            }
        }

        fetchPrices();
        setInterval(fetchPrices, 10000); // refresh every 10s
    </script>
</body>
</html>
